<!-- Joserah report standard (plugin 0.13.0; restyled for the platform 2026-10-06: Sora, then the system face). Every report, artifact or document we hand over uses this.
     HOW A REPORT READS — this is the rule, not a suggestion:
     - Lead every topic with its conclusion first, in a sentence or two, then the numbers under it.
     - Short sentences. No narration of the work, no repetition, no hedging, no bureaucratic tone.
     - Numbers, not claims. A figure with no source carries no weight.
     - Written for the reader, in their language — no file paths, no line numbers, no config keys,
       no tool names in the body. Name source documents in a short appendix at the end if needed.
     - No marketing tone, no emoji, nothing personalised or flattering.
     - No tracked ALL-CAPS eyebrow label above a heading. "BÖLÜM 1" is furniture, not information.
     - No label that only restates the heading below it. Saying it twice does not say it louder.
     - No meta string welded together out of a middle dot. A separator is not a thought.
     - No numbered markers unless the content really is a sequence. If step 2 can be read before
       step 1, it was never numbered — it was decorated.
     - No "→" appended to a link. The link is already the way there.
     - A structure device must carry information, or it does not belong on the page. Everything a
       framework hands out free is what a generated page is recognised by; ours are chosen.
     - It carries the logo and the brand, and it is not boring and not long.
     - The logo's J sits very large and faint behind the whole page (fixed, centred; burgundy at about 4% on
       transparent, so it works on both grounds). That J is the only logo on the page — no small logo at the top. Same for artifacts.
     The greys are mixed off the burgundy and are warm all the way down, in both themes.
     {{TITLE}} one line, then {{BODY}} the report, <h2 class="h"> per topic and <p class="p"> paragraphs,
     then the footer: burgundy rule, {{SIGNATURE}} left, {{DATE}} right.
     The J: the published asset URL below renders anywhere; .brand/j-faded.png is the same image for a
     render that has no network (embed it as a data URI in an artifact). Self-contained on purpose: this file is also the PDF and HTML fallback
     when no artifact can be published. -->
<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1819" media="(prefers-color-scheme: dark)">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: light dark; --bg:#f5f3f2; --tx:#2a2326; --ft:#7a6f73; --ln:#8B0D32; --br:#8B0D32;
        --sans:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,Arial,Helvetica,sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1819; --tx:#ddd5d7; --ft:#9a8d91; --ln:#e07a98; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:400 15.5px/1.7 var(--sans);
       -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.55;
       background:url(https://raw.githubusercontent.com/SerVian7/joserah/main/assets/j-faded.png)
                  no-repeat center center; background-size:min(92vmin,900px) auto; }
.wrap { max-width:720px; margin:0 auto; padding:56px 24px 48px; }
.t { font-size:30px; line-height:1.2; font-weight:300; letter-spacing:-.02em; margin:0 0 36px; text-wrap:balance; }
.h { font-size:16.5px; line-height:1.35; font-weight:600; letter-spacing:-.005em; margin:36px 0 8px; }
.p { margin:0 0 14px; max-width:68ch; }
a { color:var(--ln); text-decoration-thickness:1px; text-underline-offset:3px; }
a:focus-visible { outline:2px solid var(--ln); outline-offset:2px; }
.f { display:flex; justify-content:space-between; gap:16px; margin-top:64px; padding-top:12px;
     border-top:1px solid var(--br); font-size:12.5px; color:var(--ft); }
.d { order:1; font-variant-numeric:tabular-nums; }
@media (max-width:560px) { .wrap { padding:36px 20px 40px; } .t { font-size:25px; margin-bottom:28px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t">{{TITLE}}</h1>
  <div>{{BODY}}</div>
  <div class="f"><span class="d">{{DATE}}</span>{{SIGNATURE}}</div>
</div>
</body></html>
