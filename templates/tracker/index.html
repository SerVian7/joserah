<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracker</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f5;--card:#ffffff;--line:#dcdcd9;--ink:#222222;--muted:#5c5c59;--faint:#797976;--run:#2563a8;--you:#b4232a;--ok:#2f7d55;--wait:#a8650f;--link:#2563a8;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#242423;--line:#3a3a38;--ink:#e4e4e1;--muted:#b0b0ac;--faint:#8f8f8b;--run:#6ea8e6;--you:#ef7b80;--ok:#5fbf8f;--wait:#e0a24f;--link:#6ea8e6}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#242423;--line:#3a3a38;--ink:#e4e4e1;--muted:#b0b0ac;--faint:#8f8f8b;--run:#6ea8e6;--you:#ef7b80;--ok:#5fbf8f;--wait:#e0a24f;--link:#6ea8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.top img{height:20px;width:auto;max-width:96px}
.top .line{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .upd{color:var(--faint);white-space:nowrap}
.crew{padding:8px 0 6px;border-bottom:1px solid var(--line)}.crew-sum{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:2px 0 6px}.crew-sum span{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}.crew svg{width:18px;height:18px;flex:none;color:var(--muted)}.crew ul{list-style:none;margin:0;padding:0}.crew li.crew-line{display:flex;align-items:center;gap:8px;padding:3px 0;margin:0;background:none;border:0;border-radius:0;font-size:13px}.crew-line span{flex:1;min-width:0;overflow-wrap:anywhere}.crew-line a{color:inherit}.crew-line em{font-style:normal;color:var(--you)}.crew-line.work svg,.crew-sum .work svg{animation:crew-pulse 2.4s ease-in-out infinite}.crew-line.owner svg{color:var(--you)}.crew-sum .owner svg{color:var(--you)}.crew-line.idle,.crew-sum .idle{opacity:.5}@keyframes crew-pulse{50%{opacity:.4}}@media (prefers-reduced-motion: reduce){.crew-line.work svg,.crew-sum .work svg{animation:none}}
</style>
<style id="console">
:root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*,*::before,*::after{border-radius:0;box-shadow:none}
main{display:grid;gap:28px;max-width:820px;margin:0 auto;padding:22px 16px 56px}
main ol,main ul{list-style:none;margin:0;padding:0}
main li{margin:0;padding:0;background:none;border:0}
main>ol{display:grid;gap:28px}
li.sec{display:block}li.sec.pl{padding-top:20px;border-top:1px solid var(--faint)}
.hd{display:flex;align-items:baseline;gap:8px;padding:0 0 8px;font:600 10.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--faint)}
.hd span{font-weight:500;letter-spacing:.04em;color:var(--faint);font-variant-numeric:tabular-nums}
summary.hd{cursor:pointer;list-style:none}summary.hd::-webkit-details-marker{display:none}
summary.hd::before{content:"\25B8";width:14px;letter-spacing:0;color:var(--faint)}details[open]>summary.hd::before{content:"\25BE"}
summary.hd .lt{margin-left:auto}summary.hd:hover{color:var(--ink)}summary.hd:focus-visible{outline:1px solid var(--link);outline-offset:2px}
.clip{position:relative}
.clip.clamp{max-height:20rem;overflow:hidden}
.clip.clamp.open{max-height:min(64vh,560px);overflow-y:auto;overscroll-behavior:contain;border-bottom:1px solid var(--faint)}
@media (prefers-reduced-motion: no-preference){.clip.clamp{transition:max-height .22s ease}}
.fade{position:relative;height:64px;margin-top:-64px;background:linear-gradient(to bottom,transparent,var(--bg) 88%);cursor:pointer}
.clip.open+.fade{display:none}
.more{display:block;width:100%;margin:0;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--muted);text-align:left;cursor:pointer;font:500 11px/1.2 var(--mono);letter-spacing:.06em}
.more::before{content:"\25BE";display:inline-block;width:14px;color:var(--faint)}
.more[aria-expanded="true"]::before{content:"\25B4"}
.more:hover{color:var(--ink)}
.more:focus-visible{outline:1px solid var(--link);outline-offset:2px}
section.crew{padding:0;border:0}
.crew .hd{flex-wrap:wrap}
.crew .hd .crew-sum{display:flex;flex-wrap:wrap;margin-left:auto;gap:14px;padding:0;border:0;letter-spacing:0}
.crew-sum span{font:500 11px var(--mono);font-variant-numeric:tabular-nums;gap:4px}
.crew svg,:is(.crew,main) li.crew-line svg{width:16px;height:16px}
:is(.crew,main) li.crew-line{position:relative;display:grid;grid-template-columns:minmax(16px,auto) minmax(0,1fr) auto minmax(46px,auto);grid-template-areas:"m x l t";gap:0 12px;align-items:center;margin:0;padding:8px 0;background:none;border:0;border-bottom:1px solid var(--line);font-size:13.5px}
:is(.crew,main) li.crew-line>.ic{grid-area:m}:is(.crew,main) li.crew-line>.tx{grid-area:x}:is(.crew,main) li.crew-line>.lk{grid-area:l}:is(.crew,main) li.crew-line>time{grid-area:t}
:is(.crew,main) li.crew-line .ic,:is(.crew,main) li.crew-line .ic>span{display:inline-flex;flex:none;align-items:center;gap:4px;min-width:0}
:is(.crew,main) li.crew-line .ic>.sq{display:inline-block;width:5px;height:5px;background:currentColor;color:var(--faint)}
:is(.crew,main) li.crew-line.run .sq{color:var(--run)}:is(.crew,main) li.crew-line.you .sq{color:var(--you)}:is(.crew,main) li.crew-line.wait .sq,:is(.crew,main) li.crew-line.plan .sq{color:var(--wait)}:is(.crew,main) li.crew-line.ok .sq{color:var(--ok)}
:is(.crew,main) li.crew-line .tx{display:block;width:100%;min-width:0;margin:0;padding:0;border:0;background:none;font:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere;color:var(--ink)}
:is(.crew,main) li.crew-line .ct{flex:none;color:var(--muted)}:is(.crew,main) li.crew-line .tx .n{margin-left:8px;font:500 11px var(--mono);color:var(--faint)}
:is(.crew,main) li.crew-line .tx em,li.cat .jh em,li.cat summary em{margin-left:8px;font:600 10.5px var(--mono);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--run)}
:is(.crew,main) li.crew-line .tx::before{content:"\25B8";display:inline-block;width:14px;font:500 11px var(--mono);color:var(--faint)}
:is(.crew,main) li.crew-line .tx[aria-expanded="true"]::before{content:"\25BE"}
:is(.crew,main) li.crew-line .tx::after{content:"";position:absolute;inset:0}
:is(.crew,main) li.crew-line:hover .tx,:is(.crew,main) li.crew-line .tx[aria-expanded="true"]{color:var(--link)}
:is(.crew,main) li.crew-line .tx:focus-visible,:is(.crew,main) li.crew-line .lk:focus-visible{outline:1px solid var(--link);outline-offset:2px}
:is(.crew,main) li.crew-line>.lk{position:relative;z-index:1;font:500 11px var(--mono);color:var(--link);text-decoration:none;white-space:nowrap}
:is(.crew,main) li.crew-line>time{align-self:center;text-align:right;font:500 11px var(--mono);font-variant-numeric:tabular-nums;color:var(--faint);white-space:nowrap}
:is(.crew,main) li.crew-dl{display:block;margin:0 0 0 2px;padding:0 0 0 16px;background:none;border:0;border-left:1px solid var(--line)}
.cd{padding:10px 0 12px 24px;border-bottom:1px solid var(--faint);font:400 12.5px/1.5 var(--sans);color:var(--muted)}
.cd>b{display:block;font:500 13px/1.45 var(--sans);color:var(--ink)}.js-cd .cd:not(.bare)>b{display:none}
.cd p{margin:2px 0 0;overflow-wrap:anywhere}.cd a{color:var(--link)}.cd .dl em{font-style:normal;color:var(--you)}
.cd .nx span{margin-right:6px;font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.cd .cm{font:500 11px var(--mono);letter-spacing:.02em;color:var(--faint)}
.cd[hidden]{display:none}
.cd .ask{color:var(--ink);font-weight:500}
.cd ul.opt{list-style:none;margin:6px 0 2px;padding:0}
.cd ul.opt>li{display:block;margin:0;padding:5px 0 5px 30px;position:relative;background:none;border:0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.cd ul.opt .k{position:absolute;left:0;top:6px;min-width:18px;padding:0 4px;font:600 10.5px/1.5 var(--mono);text-align:center;color:var(--muted);border:1px solid var(--line)}
.cd ul.opt .ol{color:var(--ink);font-weight:500}.cd ul.opt .ot{display:block}.cd ul.opt .ol+.ot{margin-top:1px}
.cd ul.opt em{margin-left:8px;padding:0 5px;font:600 10px/1.6 var(--mono);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--you);border:1px solid currentColor}
.cd ul.opt>li.rec .k{color:var(--you);border-color:currentColor}.cd ul.opt .why{display:block;margin-top:2px;color:var(--you)}
:is(.crew,main) li.crew-none{display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
li.cat{display:block}li.cat>ul.ch,li.cat>ol{list-style:none;margin:0;padding:0}
li.cat>.jh,li.cat>details>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 12px;padding:10px 0 9px;border-bottom:1px solid var(--line);font:600 13.5px/1.4 var(--sans);color:var(--ink)}
.jt{min-width:0;overflow-wrap:anywhere}li.cat>.jh>span:last-child,li.cat>details>summary>span:last-child{font:500 11px var(--mono);font-variant-numeric:tabular-nums;color:var(--faint)}
li.cat>details>summary{cursor:pointer;list-style:none}li.cat>details>summary::-webkit-details-marker{display:none}
li.cat>details>summary .jt::before{content:"\25B8";display:inline-block;width:14px;font:500 11px var(--mono);color:var(--faint)}li.cat>details[open]>summary .jt::before{content:"\25BE"}
li.cat>details>summary:hover .jt{color:var(--link)}li.cat>details>summary:focus-visible{outline:1px solid var(--link);outline-offset:2px}
li.cat>ul.ch>li.crew-line{font-weight:600}
li.cat>ol,li.cat>details>ol{margin:0 0 0 2px;padding-left:16px;border-left:1px solid var(--line)}
@media (max-width:560px){:is(.crew,main) li.crew-line{grid-template-columns:minmax(16px,auto) minmax(0,1fr) auto;grid-template-areas:"m x t" ". l .";gap:2px 12px}:is(.crew,main) li.crew-line>.lk{justify-self:start}:is(.crew,main) li.crew-dl{padding-left:12px}.cd{padding-left:0}li.cat>ol,li.cat>details>ol{padding-left:12px}}
@media (max-width:560px){main{gap:24px}main>ol{gap:24px}}
</style>
</head>
<body>
<header class="top"><!--tracker:logo--><span class="line"><!--tracker:line--></span><span class="upd" data-t=""></span></header>
<main>
<!-- crew -->
<ol>
</ol>
</main>
<script>
(function(){var e=document.querySelector(".upd"),t=e&&e.getAttribute("data-t");if(!t)return;var d=new Date(t);if(isNaN(d))return;
var tr=document.documentElement.lang==="tr",hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
e.textContent=tr?"güncelleme "+hm:"updated "+hm;})();
</script>
<script id="clip">(function(){var N=5;function fit(c){if(c.classList.contains("open"))return;var l=c.querySelectorAll(":scope>ol>li:not(.crew-dl)");if(l.length<=N)return;var t=c.getBoundingClientRect().top,b=l[N-1].getBoundingClientRect().bottom,n=l[N].getBoundingClientRect().height;c.style.maxHeight=Math.round(b-t+Math.min(30,n/2))+"px"}
function all(){document.querySelectorAll(".clip.clamp").forEach(fit)}
function toggle(b){var c=document.getElementById(b.getAttribute("aria-controls")),o=b.getAttribute("aria-expanded")!=="true",r=c.getBoundingClientRect(),h0=r.height;b.setAttribute("aria-expanded",String(o));c.classList.toggle("open",o);if(o){c.style.maxHeight=""}else{c.scrollTop=0;fit(c);if(r.top<0){var h1=parseFloat(c.style.maxHeight)||h0;window.scrollBy(0,h1-h0)}}b.textContent=o?b.dataset.less:b.dataset.label}
document.addEventListener("click",function(e){var b=e.target.closest(".more");if(b){toggle(b);return}var f=e.target.closest(".fade");if(f){var m=f.parentNode.querySelector(".more");if(m)toggle(m)}});
document.addEventListener("toggle",function(e){var t=e.target;if(t.querySelectorAll)t.querySelectorAll(".clip.clamp").forEach(fit);var c=t.closest&&t.closest(".clip.clamp");if(c)fit(c)},true);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(all,120)});all();window.addEventListener("load",all)})();</script>
<script id="panel">(function(){function all(){return document.querySelectorAll("button.tx[aria-controls]")}function set(b,o){b.setAttribute("aria-expanded",String(o));var d=document.getElementById(b.getAttribute("aria-controls"));if(d)d.hidden=!o}function init(){var bs=all();if(!bs.length)return;document.documentElement.classList.add("js-cd");Array.prototype.forEach.call(bs,function(b){set(b,false)})}document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button.tx[aria-controls]");if(!b)return;var o=b.getAttribute("aria-expanded")!=="true";Array.prototype.forEach.call(all(),function(x){if(x!==b)set(x,false)});set(b,o)});if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init()})();</script>
<script id="state">(function(){var K="trk:"+location.pathname,ready=false,t=0;function each(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)}function dk(d){if(d.id)return d.id;var s=d.querySelector("summary");return"S:"+(s?s.textContent:"").trim().slice(0,80)}function get(){try{return JSON.parse(localStorage.getItem(K)||"null")}catch(e){return null}}function snap(){var p=null,d=[],c=[];each("button.tx[aria-controls]",function(b){if(b.getAttribute("aria-expanded")==="true")p=b.getAttribute("aria-controls")});each("details",function(x){if(x.open)d.push(dk(x))});each("button.more[aria-controls]",function(b){if(b.getAttribute("aria-expanded")==="true")c.push(b.getAttribute("aria-controls"))});return{p:p,d:d,c:c,y:Math.round(window.scrollY||0)}}function put(){if(!ready)return;try{localStorage.setItem(K,JSON.stringify(snap()))}catch(e){}}function later(){clearTimeout(t);t=setTimeout(put,150)}function restore(){var s=get();if(!s||typeof s!=="object")return;var d=s.d||[],c=s.c||[],y=+s.y||0;each("details",function(x){x.open=d.indexOf(dk(x))>=0});each("button.tx[aria-controls]",function(b){if(s.p&&b.getAttribute("aria-controls")===s.p){b.setAttribute("aria-expanded","true");var e=document.getElementById(s.p);if(e)e.hidden=false}});each("button.more[aria-controls]",function(b){if(c.indexOf(b.getAttribute("aria-controls"))>=0&&b.getAttribute("aria-expanded")!=="true")b.click()});if(y>0){window.scrollTo(0,y);window.addEventListener("load",function(){window.scrollTo(0,y)})}}function go(){restore();ready=true;document.addEventListener("click",later);document.addEventListener("toggle",later,true);window.addEventListener("scroll",later);window.addEventListener("pagehide",put)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go()})();</script>
</body>
