<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!--changelog:title--></title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f5;--card:#ffffff;--line:#dcdcd9;--ink:#222222;--muted:#5c5c59;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#242423;--line:#3a3a38;--ink:#e4e4e1;--muted:#b0b0ac}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#242423;--line:#3a3a38;--ink:#e4e4e1;--muted:#b0b0ac}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
header img{display:block;height:32px;width:auto;max-width:160px;margin-bottom:12px}
h1{margin:0;font-size:22px;line-height:1.25}
header p{margin:6px 0 0;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:600}
ul{margin:0;padding:0 14px 12px 32px}
li{margin:4px 0}
</style>
</head>
<body>
<main>
<header><!--changelog:logo--><h1><!--changelog:heading--></h1><!--changelog:desc--></header>
<!--changelog:sections-->
</main>
</body>
</html>
