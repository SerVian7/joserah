<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!--trail:title--></title>
<style id="theme">
<!--trail:theme-->
</style>
<style id="trail">
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.top img{height:20px;width:auto;max-width:96px}
.top .line{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .upd{color:var(--faint);white-space:nowrap}
main{display:grid;gap:28px;max-width:820px;margin:0 auto;padding:22px 16px 56px}
main ol,main ul{list-style:none;margin:0;padding:0}
main li{margin:0;padding:0}
.days{display:grid;gap:24px}
.none{margin:0;padding:8px 0;color:var(--muted);font-size:13.5px}
time{font:500 11px var(--mono);font-variant-numeric:tabular-nums;color:var(--faint);white-space:nowrap;text-align:right}
.oi,.eh{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:0 12px;align-items:baseline}
.oi{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.oi a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.oi a:hover{color:var(--link)}
.oi .m{grid-column:2;font-size:12.5px;color:var(--muted)}
.ent{padding:10px 0 12px;border-bottom:1px solid var(--line)}
.ty{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ty::before{content:"";display:inline-block;flex:none;width:5px;height:5px;background:var(--faint)}
.t-mail-in .ty::before,.t-mail-out .ty::before,.t-offer .ty::before{background:var(--run)}
.t-options .ty::before,.t-draft .ty::before{background:var(--you)}
.t-decision .ty::before{background:var(--ok)}.t-waiting .ty::before{background:var(--wait)}
.et{font:500 13.5px/1.45 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.eb{padding:4px 0 0 108px;font:400 13px/1.5 var(--sans);color:var(--muted)}
.eb::after{content:"";display:block;clear:both}
.eb p{margin:2px 0 0;overflow-wrap:anywhere}.eb a{color:var(--link)}
.meta{color:var(--ink)}
.sb{font:500 11px var(--mono);color:var(--faint)}.sb a{color:var(--faint)}
.sup .et,.sup .eb{opacity:.6}
.tag{display:inline-block;margin-left:8px;padding:0 4px;border:1px solid currentColor;font:600 10px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.tag.st-ok,.tag.sel,.tag.sent,.tag.done{color:var(--ok)}.tag.st-wait,.tag.open{color:var(--wait)}.tag.st-no{color:var(--faint)}.tag.rec{color:var(--run)}
.miss{font-style:italic;color:var(--faint)}
.pr{font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.th{float:right;width:72px;height:72px;margin:0 0 6px 12px;object-fit:cover;border:1px solid var(--line);background:var(--card)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px;margin-top:8px}
.opt{display:flex;flex-direction:column;gap:3px;padding:0 0 8px;border-bottom:1px solid var(--line)}
.opt .im{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.opt .im img{display:block;width:100%;height:100%;object-fit:cover}
.opt b{font:500 13px/1.4 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.opt .tag{margin:2px 6px 0 0;align-self:flex-start}
.opt.sel .im{outline:2px solid var(--ok);outline-offset:-2px}
.pick{display:grid;gap:8px;margin:8px 0 0}
.pick img{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);background:var(--card)}
.pick figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pick b{font:600 15px/1.4 var(--sans);color:var(--ink)}
.pick .tag{margin-left:0}
.dbox{margin-top:6px;border:1px solid var(--line);background:var(--card)}
.dbox pre{margin:0;padding:10px 12px;font:400 13px/1.5 var(--sans);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.copy{margin-top:6px;padding:4px 10px;border:1px solid var(--line);background:none;color:var(--link);font:500 11px var(--mono);cursor:pointer}
.copy:focus-visible,.oi a:focus-visible{outline:1px solid var(--link);outline-offset:2px}
details.tx{margin-top:4px}details.tx>summary{cursor:pointer;font:500 11px var(--mono);color:var(--faint)}
details.tx pre{margin:4px 0 0;font:400 13px/1.5 var(--sans);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:560px){.oi,.eh{grid-template-columns:minmax(0,1fr) auto}.oi .ty,.eh .ty{grid-column:1/-1}.oi .m{grid-column:1}.eb{padding-left:0}main{gap:24px}}
</style>
</head>
<body>
<header class="top"><!--trail:logo--><span class="line"><!--trail:line--></span><span class="upd" data-t="<!--trail:t-->"></span></header>
<main>
<!--trail:main-->
</main>
<script>
(function(){var e=document.querySelector(".upd"),t=e&&e.getAttribute("data-t");if(!t)return;var d=new Date(t);if(isNaN(d))return;
var tr=document.documentElement.lang==="tr",hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
e.textContent=tr?"güncelleme "+hm:"updated "+hm;})();
</script>
<script id="clip"><!--trail:clip--></script>
<script id="copy">
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button.copy");if(!b)return;var p=document.getElementById(b.getAttribute("data-for"));if(!p)return;
var l=b.getAttribute("data-label"),d=b.getAttribute("data-done");function ok(){b.textContent=d;setTimeout(function(){b.textContent=l},1500)}
try{navigator.clipboard.writeText(p.textContent).then(ok,function(){})}catch(x){try{var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(y){}}});
</script>
</body>
</html>
