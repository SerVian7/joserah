<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1819" media="(prefers-color-scheme: dark)">
<title><!--case:title--></title>
<style id="theme">
<!--case:theme-->
</style>
<style>
:root{--brand:<!--case:accent-->}
.band{border-bottom:1px solid var(--line)}html.jz-framed .band{display:none}
.in,.wrap{max-width:880px;margin:0 auto;padding-inline:20px}
.band .in{min-height:44px;padding-block:12px;display:flex;align-items:center;gap:16px}
.band img{height:18px;width:auto;display:block}
.wrap{padding-block:24px 64px;display:grid;gap:20px}
.wrap>*{min-width:0}
.eyebrow{font:500 12.5px/1.4 var(--sans);color:var(--muted)}.eyebrow:empty{display:none}
h1{font:600 24px/1.25 var(--sans);letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance}
.list{display:grid}
.list>.g{padding-block:14px;border-top:1px solid var(--line);display:grid;gap:12px}
.list>.g:first-child{border-top:0;padding-top:0}
.grp{margin:0;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.grp .cnt{font-weight:400;letter-spacing:0;color:var(--faint)}
.gbtn{min-height:36px;padding:4px 0;background:none;border:0;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left;color:var(--muted)}.gbtn[aria-expanded="true"]{color:var(--ink)}.gbtn .car{width:12px;color:var(--faint)}
.gnote{margin:-4px 0 0;max-width:72ch;font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:1px solid var(--line)}
.chips button{min-height:40px;margin:0 0 -1px;padding:8px 0;display:inline-flex;gap:8px;align-items:center;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font:500 13.5px var(--sans);color:var(--muted)}
.chips button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.dot{width:7px;height:7px;flex:none;background:var(--line)}.dot.ok{background:var(--ok)}.dot.wait{background:var(--wait)}.dot.no{background:transparent;outline:1px solid var(--faint);outline-offset:-1px}
.case{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.case .img{display:grid;place-items:center;min-height:240px;padding:16px;background:color-mix(in srgb,var(--ink) 4%,var(--card));border-right:1px solid var(--line)}
.case .img:empty{display:none}.case .img:empty+.body{grid-column:1/-1}
.case .img img{display:block;max-width:100%;max-height:300px;object-fit:contain}
.case .body{min-width:0;padding:22px 24px;display:grid;gap:14px;align-content:start}
.lbl{display:none}
.case h2{margin:0;font:600 19px/1.3 var(--sans);letter-spacing:-.01em}
.sub{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.why{margin:-2px 0 0;display:flex;gap:9px;align-items:baseline;font-size:13.5px}.why .dot{display:inline-block;transform:translateY(-1px)}.okt{color:var(--ok)}.waitt{color:var(--wait)}.not{color:var(--muted)}
.pick{justify-self:start;padding:0 5px;border:1px solid currentColor;font:600 10px/1.6 var(--mono);letter-spacing:.06em;color:var(--ok)}
.rec{padding:10px 14px;border-left:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 6%,transparent);font-size:13.5px;color:var(--ink)}.rec b{display:block;margin-bottom:2px;font:600 12px/1.4 var(--sans);color:var(--link)}
.price{font:500 15px var(--mono);font-variant-numeric:tabular-nums}.price small{display:block;margin-top:2px;font:400 11.5px var(--sans);color:var(--faint)}
.pc{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}.pc p{margin:0}.pc .p::before{content:"+ ";color:var(--ok)}.pc .c::before{content:"\2212  ";color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:10px 0 0;font-size:13.5px;line-height:1.45}
.kv dt{font-weight:500;color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
details.more{display:block;width:auto;min-height:0;margin:0;padding:0;border:0;font:inherit;color:inherit;cursor:auto}details.more::before{content:none}
.more summary{min-height:32px;display:flex;gap:8px;align-items:center;list-style:none;cursor:pointer;font:500 11.5px var(--mono);letter-spacing:.02em;color:var(--muted)}.more summary::-webkit-details-marker{display:none}.more summary::before{content:"\25b8";width:12px;color:var(--faint)}.more[open] summary::before{content:"\25be"}
.links{display:flex;flex-direction:column;gap:6px}
.links a,.ulinks a{font-size:13.5px;color:var(--link);text-decoration:none}.links a::after{content:" \2197";font-size:.85em}
.navb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.navb button{min-height:40px;padding:0 16px;background:none;border:1px solid var(--line);cursor:pointer;font:500 13px var(--sans);color:var(--ink)}
.navb button:disabled{opacity:.35;cursor:default}
.navb span{font:400 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--faint)}
.req{padding-top:14px;border-top:1px solid var(--line);display:grid;gap:12px}
.req ul{margin:0;padding:0;list-style:none;display:grid}
.req li{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}.req li .dot{transform:translateY(-1px)}.req li em{font:400 11px var(--mono);font-style:normal;font-variant-numeric:tabular-nums;color:var(--faint)}
.job{margin:0;font-size:13.5px;color:var(--wait)}.ulinks{margin:0}
@media (hover: hover){.gbtn:hover,.chips button:hover,.more summary:hover{color:var(--ink)}.navb button:hover:not(:disabled){border-color:var(--link)}.links a:hover,.ulinks a:hover{text-decoration:underline}}
@media (pointer: coarse){.gbtn,.chips button,.navb button,.more summary{min-height:44px}}
@media (max-width:640px){.case{grid-template-columns:1fr}.case .img{min-height:160px;border-right:0;border-bottom:1px solid var(--line)}.case .body{padding:18px 16px}.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}.in,.wrap{padding-inline:16px}h1{font-size:20px}.chips{gap:0 18px}.req li{grid-template-columns:10px 1fr}.req em{grid-column:2}}
</style>
</head>
<body>
<!--case:band-->
<main class="wrap">
  <header>
    <div class="eyebrow"><!--case:eyebrow--></div>
    <h1><!--case:heading--></h1>
  </header>
  <div class="list" id="list"><!--case:list--></div>
  <div id="update"><!--case:update--></div>
</main>
<script type="application/json" id="data"><!--case:data--></script>
<script><!--case:client--></script>
</body>
</html>
