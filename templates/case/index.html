<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--case:title--></title>
<style>
:root{color-scheme:dark;
  --bg:#1e1e20;--band:#1a1a1c;--card:#232326;--line:#323236;--ink:#e8e8ea;--muted:#a3a3a8;--faint:#707076;
  --brand:<!--case:accent-->;--link:#8ab4f8;--ok:#5fbf8f;--wait:#e0a24f;--no:#f0575d;
  --sans:system-ui,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;margin:0}
.band{background:var(--band);border-bottom:1px solid var(--line)}
.in,.wrap{max-width:880px;margin:0 auto;padding-inline:20px}
.band .in{padding-block:14px;display:flex;align-items:center;gap:16px}
.band img{height:20px;width:auto;display:block}
.eyebrow,.lbl,.grp{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.wrap{padding-block:20px 40px;display:grid;gap:16px}
.wrap>*{min-width:0}
.eyebrow{color:var(--brand)}
h1{font:600 22px/1.25 var(--sans);letter-spacing:-.015em;margin:6px 0 0;text-wrap:balance}
.list{display:grid}
.list>.g{padding-block:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.list>.g:first-child{border-top:0;padding-top:0}
.grp{color:var(--ink);margin:0}.grp .cnt{color:var(--faint)}
.gbtn{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--muted)}.gbtn:hover{color:var(--ink)}.gbtn .car{width:10px}
.gnote{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:500 12px var(--sans);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chips button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:1px solid var(--muted);outline-offset:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}.ok{background:var(--ok)}.wait{background:var(--wait)}.no{background:var(--no)}
.case{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.case .img{background:#141416;display:grid;place-items:center;min-height:240px;padding:16px}
.case .img:empty{display:none}.case .img:empty+.body{grid-column:1/-1}
.case .img img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.case .body{padding:22px 24px;display:grid;gap:14px;align-content:start;min-width:0}
.lbl{color:var(--faint)}
.case h2{margin:0;font:600 19px/1.3 var(--sans)}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 0}
.why{margin:-4px 0 0;font-size:13px;display:flex;gap:8px;align-items:center}.why .dot{display:inline-block}.not{color:var(--no)}.waitt{color:var(--wait)}.okt{color:var(--ok)}
.pick{font:500 11px var(--mono);color:var(--ok);letter-spacing:.08em}
.rec{border:1px solid var(--brand);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted)}.rec b{color:var(--ink);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.price{font:500 13px var(--mono)}.price small{display:block;font:400 11px var(--sans);color:var(--faint)}
.pc{display:grid;gap:4px;font-size:13px;color:var(--muted)}.pc p{margin:0}.pc .p::before{content:"+ ";color:var(--ok)}.pc .c::before{content:"\2212  ";color:var(--no)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:14px;margin:10px 0 0;line-height:1.45}
.kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0;overflow-wrap:anywhere}
.more summary{cursor:pointer;font:500 12px var(--mono);letter-spacing:.06em;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}.more summary::-webkit-details-marker{display:none}.more summary::before{content:"\25b8";width:10px}.more[open] summary::before{content:"\25be"}
.links{display:flex;flex-direction:column;gap:4px}
.links a,.ulinks a{color:var(--link);font-size:13px;text-decoration:none}.links a::after{content:" \2197";font-size:.85em}
.links a:hover,.ulinks a:hover{text-decoration:underline;text-underline-offset:3px}
.navb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.navb button{font:500 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
.navb button:disabled{opacity:.35;cursor:default}
.navb span{font:500 12px var(--mono);color:var(--faint)}
.req{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.req ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.req li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;font-size:14px;color:var(--muted)}.req li em{font:500 11px var(--mono);font-style:normal;color:var(--faint)}
.job{margin:0;font-size:13px;color:var(--wait)}.ulinks{margin:0}
@media (max-width:640px){.case{grid-template-columns:1fr}.case .img{min-height:160px}.case .body{padding:18px 16px}.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}.in,.wrap{padding-inline:16px}h1{font-size:19px}.navb button{padding:9px 14px}.req li{grid-template-columns:10px 1fr}.req em{grid-column:2}}
</style>
</head>
<body>
<!--case:band-->
<main class="wrap">
  <header>
    <div class="eyebrow"><!--case:eyebrow--></div>
    <h1><!--case:heading--></h1>
  </header>
  <div class="list" id="list"><!--case:list--></div>
  <div id="update"><!--case:update--></div>
</main>
<script type="application/json" id="data"><!--case:data--></script>
<script><!--case:client--></script>
</body>
</html>
